<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiSkills 3.0 - Blog Dashboard with Redux Toolkit &amp; Performance Hooks</title>
  <link rel="stylesheet" href="App.css" />
  <!-- CDN Scripts for React 18, Redux Toolkit, React-Redux & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@reduxjs/toolkit@1.9.5/dist/redux-toolkit.umd.min.js"></script>
  <script src="https://unpkg.com/react-redux@8.1.1/dist/react-redux.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback, memo } = React;
    const { createSlice, configureStore, createAsyncThunk } = window.RTK;
    const { Provider, useSelector, useDispatch } = window.ReactRedux;

    // ========================================================================
    // 1. SAMPLE BLOG DATA
    // ========================================================================
    const initialBlogs = [
      { id: 1, title: "Understanding React Hooks", category: "React", author: "Ali Khan", readingTime: 6, featured: true },
      { id: 2, title: "Redux Toolkit Basics", category: "Redux", author: "Sara Ahmed", readingTime: 8, featured: false },
      { id: 3, title: "Building Blog UI in React", category: "React", author: "Hamza Malik", readingTime: 5, featured: false },
      { id: 4, title: "Node.js and Express Introduction", category: "Node", author: "Ayesha Noor", readingTime: 7, featured: true }
    ];

    // ========================================================================
    // 2. REDUX TOOLKIT SLICE & ASYNC THUNK
    // ========================================================================
    const fetchBlogs = createAsyncThunk(
      "blogs/fetchBlogs",
      async (_, { rejectWithValue }) => {
        try {
          // Simulate network latency (800ms)
          await new Promise((resolve) => setTimeout(resolve, 800));
          return initialBlogs;
        } catch (err) {
          return rejectWithValue("Failed to fetch blogs from simulated API.");
        }
      }
    );

    const blogSlice = createSlice({
      name: "blogs",
      initialState: {
        blogs: initialBlogs,
        searchText: "",
        selectedCategory: "All",
        loading: false,
        error: null
      },
      reducers: {
        addBlog: (state, action) => {
          const newId = state.blogs.length > 0 ? Math.max(...state.blogs.map(b => b.id)) + 1 : 1;
          const newBlog = {
            id: newId,
            title: action.payload.title,
            category: action.payload.category || "General",
            author: action.payload.author || "Anonymous",
            readingTime: Number(action.payload.readingTime) || 5,
            featured: Boolean(action.payload.featured)
          };
          state.blogs.unshift(newBlog);
        },
        deleteBlog: (state, action) => {
          state.blogs = state.blogs.filter((blog) => blog.id !== action.payload);
        },
        toggleFeatured: (state, action) => {
          const blog = state.blogs.find((b) => b.id === action.payload);
          if (blog) {
            blog.featured = !blog.featured;
          }
        },
        setSearchText: (state, action) => {
          state.searchText = action.payload;
        },
        setSelectedCategory: (state, action) => {
          state.selectedCategory = action.payload;
        }
      },
      extraReducers: (builder) => {
        builder
          .addCase(fetchBlogs.pending, (state) => {
            state.loading = true;
            state.error = null;
          })
          .addCase(fetchBlogs.fulfilled, (state, action) => {
            state.loading = false;
            state.blogs = action.payload;
          })
          .addCase(fetchBlogs.rejected, (state, action) => {
            state.loading = false;
            state.error = action.payload || "An unexpected error occurred.";
          });
      }
    });

    const { addBlog, deleteBlog, toggleFeatured, setSearchText, setSelectedCategory } = blogSlice.actions;

    // Redux Store
    const store = configureStore({
      reducer: {
        blogs: blogSlice.reducer
      }
    });

    // ========================================================================
    // 3. CUSTOM HOOK: useFilteredBlogs (with useMemo)
    // ========================================================================
    function useFilteredBlogs(blogs = [], searchText = "", selectedCategory = "All") {
      return useMemo(() => {
        if (!Array.isArray(blogs)) return [];
        const query = searchText.trim().toLowerCase();

        return blogs.filter((blog) => {
          const matchesSearch =
            !query ||
            blog.title.toLowerCase().includes(query) ||
            blog.author.toLowerCase().includes(query) ||
            blog.category.toLowerCase().includes(query);

          const matchesCategory =
            selectedCategory === "All" ||
            blog.category.toLowerCase() === selectedCategory.toLowerCase();

          return matchesSearch && matchesCategory;
        });
      }, [blogs, searchText, selectedCategory]);
    }

    // ========================================================================
    // 4. REUSABLE COMPONENTS
    // ========================================================================

    // Header Component
    function Header({ onFetchBlogs, loading }) {
      return (
        <header className="app-header">
          <div className="header-brand">
            <div className="brand-badge">⚡ DigiSkills 3.0 Full Stack</div>
            <h1>Blog Dashboard</h1>
            <p>React Hooks, Custom Hooks, Performance Optimization &amp; Redux Toolkit</p>
          </div>
          <div className="header-actions">
            <button
              className="btn-fetch"
              onClick={onFetchBlogs}
              disabled={loading}
              title="Dispatch Redux createAsyncThunk to simulate API fetching"
            >
              {loading ? "⏳ Fetching Blogs..." : "🔄 Refresh via Async Thunk"}
            </button>
          </div>
        </header>
      );
    }

    // BlogStats Component
    function BlogStats({ blogs = [] }) {
      const stats = useMemo(() => {
        const total = blogs.length;
        const featured = blogs.filter((b) => b.featured).length;
        const totalReadingTime = blogs.reduce((sum, b) => sum + (Number(b.readingTime) || 0), 0);
        const uniqueCategories = new Set(blogs.map((b) => b.category)).size;
        return { total, featured, totalReadingTime, uniqueCategories };
      }, [blogs]);

      return (
        <div className="stats-container">
          <div className="stat-card">
            <span className="stat-icon">📚</span>
            <div>
              <span className="stat-label">Total Blogs</span>
              <h4 className="stat-value">{stats.total}</h4>
            </div>
          </div>
          <div className="stat-card">
            <span className="stat-icon">⭐</span>
            <div>
              <span className="stat-label">Featured Posts</span>
              <h4 className="stat-value">{stats.featured}</h4>
            </div>
          </div>
          <div className="stat-card">
            <span className="stat-icon">⏱️</span>
            <div>
              <span className="stat-label">Total Reading Time</span>
              <h4 className="stat-value">{stats.totalReadingTime} mins</h4>
            </div>
          </div>
          <div className="stat-card">
            <span className="stat-icon">🏷️</span>
            <div>
              <span className="stat-label">Categories</span>
              <h4 className="stat-value">{stats.uniqueCategories}</h4>
            </div>
          </div>
        </div>
      );
    }

    // SearchBar Component with useRef focus
    function SearchBar({ searchText, onSearchChange, selectedCategory, onCategoryChange, inputRef }) {
      const categories = ["All", "React", "Redux", "Node"];
      return (
        <div className="searchbar-container">
          <div className="search-input-wrapper">
            <span className="search-icon">🔍</span>
            <input
              ref={inputRef}
              type="text"
              className="search-input"
              placeholder="Search blogs by title, author, or category..."
              value={searchText}
              onChange={(e) => onSearchChange(e.target.value)}
            />
            {searchText && (
              <button
                className="btn-clear-search"
                onClick={() => onSearchChange("")}
                title="Clear search"
              >
                ✕
              </button>
            )}
          </div>
          <div className="category-filter-wrapper">
            <label htmlFor="cat-select" className="filter-label">Category:</label>
            <select
              id="cat-select"
              className="category-select"
              value={selectedCategory}
              onChange={(e) => onCategoryChange(e.target.value)}
            >
              {categories.map((cat) => (
                <option key={cat} value={cat}>
                  {cat === "All" ? "All Categories" : cat}
                </option>
              ))}
            </select>
          </div>
        </div>
      );
    }

    // BlogCard Component wrapped with React.memo
    const BlogCard = memo(function BlogCard({ blog, onToggleFeatured, onDeleteBlog }) {
      console.log(`[Render] BlogCard #${blog.id}: "${blog.title}"`);

      const getCategoryClass = (cat) => {
        switch (cat.toLowerCase()) {
          case "react": return "badge-react";
          case "redux": return "badge-redux";
          case "node": return "badge-node";
          default: return "badge-default";
        }
      };

      return (
        <article className={`blog-card ${blog.featured ? "featured-card" : ""}`}>
          <div className="card-top-meta">
            <span className={`category-badge ${getCategoryClass(blog.category)}`}>
              {blog.category}
            </span>
            {blog.featured && (
              <span className="featured-badge">⭐ Featured</span>
            )}
          </div>

          <h3 className="blog-title">{blog.title}</h3>

          <div className="blog-info">
            <div className="author-meta">
              <span className="author-avatar">✍️</span>
              <span className="author-name">{blog.author}</span>
            </div>
            <div className="reading-time">
              <span>⏱️ {blog.readingTime} min read</span>
            </div>
          </div>

          <div className="card-actions">
            <button
              className={`btn-feature-toggle ${blog.featured ? "is-featured" : ""}`}
              onClick={() => onToggleFeatured(blog.id)}
            >
              {blog.featured ? "★ Unfeature" : "☆ Feature"}
            </button>
            <button
              className="btn-delete"
              onClick={() => onDeleteBlog(blog.id)}
            >
              🗑️ Delete
            </button>
          </div>
        </article>
      );
    });

    // BlogList Component
    function BlogList({ blogs, onToggleFeatured, onDeleteBlog }) {
      if (!blogs || blogs.length === 0) {
        return (
          <div className="empty-state">
            <div className="empty-icon">📭</div>
            <h3>No Blogs Found</h3>
            <p>No blog posts matched your search criteria or category filter.</p>
          </div>
        );
      }

      return (
        <div className="blog-grid">
          {blogs.map((blog) => (
            <BlogCard
              key={blog.id}
              blog={blog}
              onToggleFeatured={onToggleFeatured}
              onDeleteBlog={onDeleteBlog}
            />
          ))}
        </div>
      );
    }

    // AddBlogForm Component
    function AddBlogForm({ onAddBlog }) {
      const [isOpen, setIsOpen] = useState(false);
      const [title, setTitle] = useState("");
      const [category, setCategory] = useState("React");
      const [author, setAuthor] = useState("");
      const [readingTime, setReadingTime] = useState(5);
      const [featured, setFeatured] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim() || !author.trim()) return;

        onAddBlog({
          title: title.trim(),
          category,
          author: author.trim(),
          readingTime: Number(readingTime) || 5,
          featured
        });

        setTitle("");
        setAuthor("");
        setReadingTime(5);
        setFeatured(false);
        setIsOpen(false);
      };

      return (
        <div className="add-blog-section">
          {!isOpen ? (
            <button className="btn-open-form" onClick={() => setIsOpen(true)}>
              ➕ Add New Blog Post
            </button>
          ) : (
            <form className="add-blog-form" onSubmit={handleSubmit}>
              <div className="form-header">
                <h3>Publish New Blog Post</h3>
                <button type="button" className="btn-close-form" onClick={() => setIsOpen(false)}>✕</button>
              </div>

              <div className="form-grid">
                <div className="form-group">
                  <label>Blog Title *</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. Master CSS Grid"
                    value={title}
                    onChange={(e) => setTitle(e.target.value)}
                  />
                </div>
                <div className="form-group">
                  <label>Author Name *</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. Faisal Khan"
                    value={author}
                    onChange={(e) => setAuthor(e.target.value)}
                  />
                </div>
                <div className="form-group">
                  <label>Category</label>
                  <select value={category} onChange={(e) => setCategory(e.target.value)}>
                    <option value="React">React</option>
                    <option value="Redux">Redux</option>
                    <option value="Node">Node</option>
                    <option value="General">General</option>
                  </select>
                </div>
                <div className="form-group">
                  <label>Reading Time (Mins)</label>
                  <input
                    type="number"
                    min="1"
                    max="60"
                    value={readingTime}
                    onChange={(e) => setReadingTime(e.target.value)}
                  />
                </div>
              </div>

              <div className="form-footer">
                <label className="checkbox-label">
                  <input
                    type="checkbox"
                    checked={featured}
                    onChange={(e) => setFeatured(e.target.checked)}
                  />
                  <span>Mark as Featured Post ⭐</span>
                </label>
                <div className="form-buttons">
                  <button type="button" className="btn-cancel" onClick={() => setIsOpen(false)}>Cancel</button>
                  <button type="submit" className="btn-submit">✓ Add Blog</button>
                </div>
              </div>
            </form>
          )}
        </div>
      );
    }

    // ========================================================================
    // 5. MAIN APP COMPONENT
    // ========================================================================
    function App() {
      const dispatch = useDispatch();

      // Read Redux state with useSelector
      const { blogs, searchText, selectedCategory, loading, error } = useSelector(
        (state) => state.blogs
      );

      // Performance: useRef to auto-focus search input on page load
      const searchInputRef = useRef(null);

      useEffect(() => {
        if (searchInputRef.current) {
          searchInputRef.current.focus();
        }
      }, []);

      // Performance: useCallback for event handlers
      const handleDeleteBlog = useCallback((id) => {
        dispatch(deleteBlog(id));
      }, [dispatch]);

      const handleToggleFeatured = useCallback((id) => {
        dispatch(toggleFeatured(id));
      }, [dispatch]);

      const handleSearchChange = useCallback((text) => {
        dispatch(setSearchText(text));
      }, [dispatch]);

      const handleCategoryChange = useCallback((cat) => {
        dispatch(setSelectedCategory(cat));
      }, [dispatch]);

      const handleAddBlog = useCallback((newBlog) => {
        dispatch(addBlog(newBlog));
      }, [dispatch]);

      const handleRefresh = useCallback(() => {
        dispatch(fetchBlogs());
      }, [dispatch]);

      // Custom Hook useFilteredBlogs (useMemo inside)
      const filteredBlogs = useFilteredBlogs(blogs, searchText, selectedCategory);

      return (
        <div className="dashboard-container">
          <Header onFetchBlogs={handleRefresh} loading={loading} />
          <BlogStats blogs={blogs} />
          <SearchBar
            inputRef={searchInputRef}
            searchText={searchText}
            onSearchChange={handleSearchChange}
            selectedCategory={selectedCategory}
            onCategoryChange={handleCategoryChange}
          />
          <AddBlogForm onAddBlog={handleAddBlog} />

          {loading && (
            <div className="loading-banner">
              <div className="spinner"></div>
              <span>Fetching blogs via createAsyncThunk...</span>
            </div>
          )}

          {error && (
            <div className="error-banner">
              <span>⚠️ {error}</span>
              <button className="btn-retry" onClick={handleRefresh}>Retry</button>
            </div>
          )}

          <div className="results-header">
            <h2>
              Articles <span className="results-badge">{filteredBlogs.length} of {blogs.length}</span>
            </h2>
            {(searchText || selectedCategory !== "All") && (
              <span className="filter-summary">
                Filtered by: {searchText && <strong>"{searchText}"</strong>}{" "}
                {selectedCategory !== "All" && <span className="tag-indicator">Category: {selectedCategory}</span>}
              </span>
            )}
          </div>

          <BlogList
            blogs={filteredBlogs}
            onToggleFeatured={handleToggleFeatured}
            onDeleteBlog={handleDeleteBlog}
          />

          <footer className="dashboard-footer">
            <p>DigiSkills 3.0 &bull; Full Stack Web Development &bull; Blog Dashboard with Redux Toolkit</p>
          </footer>
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <Provider store={store}>
        <App />
      </Provider>
    );
  </script>
</body>
</html>
